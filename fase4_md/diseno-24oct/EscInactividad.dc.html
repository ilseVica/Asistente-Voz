<a href="EscPanel.dc.html" aria-label="Cerrar" style="width: 44px; height: 44px; border-radius: 12px; display: flex; align-items: center; justify-content: center; color: #1B1F1E; flex: none"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" style="stroke-width: 2; stroke-linecap: round; stroke-linejoin: round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></a>

<p style="margin: 0; font-size: 17px; line-height: 1.5; color: #4A524F">Si no se detecta movimiento en la sala durante este tiempo, se avisa a la familia por Telegram. El asistente no dice nada en voz alta.</p>
<div style="display: flex; flex-direction: column; gap: 8px">
<label for="minutos" style="font-size: 17px; font-weight: 700">Minutos sin movimiento</label>

<input id="minutos" type="number" min="2" max="720" value="120" style="font-family: inherit; font-size: 22px; font-weight: 700; padding: 10px 14px; min-height: 56px; box-sizing: border-box; border-radius: 12px; border: 2px solid #0E5E5A; width: 140px">

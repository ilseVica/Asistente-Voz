<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Nuevo recordatorio (escritorio)</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#0E5E5A}a:hover{color:#0A4441}
</style>
</helmet>
<div style="min-height: 100vh; background: #F4F5F2; font-family: 'Atkinson Hyperlegible', 'Segoe UI', sans-serif; color: #1B1F1E; box-sizing: border-box; position: relative">

<div style="padding: 32px 24px 48px; box-sizing: border-box">
<div style="max-width: 1200px; margin: 0 auto; display: flex; flex-direction: column; gap: 24px">
<header style="display: flex; justify-content: space-between; align-items: center; gap: 16px">
<div style="display: flex; align-items: center; gap: 14px">
<div style="width: 48px; height: 48px; border-radius: 14px; background: #0E5E5A"></div>
<div><div style="font-size: 15px; color: #4A524F">Asistente de Voz</div><div style="font-size: 30px; font-weight: 700; line-height: 1.15">Sala principal</div></div>
</div>
<span style="padding: 8px 16px; border-radius: 999px; background: #E3F0EE; color: #0E5E5A; font-weight: 700; font-size: 16px">Sala conectada</span>
</header>
<div style="height: 44px; border-bottom: 1px solid #DADFDB"></div>
<div style="font-size: 28px; font-weight: 700">Recordatorios</div>
<div style="height: 320px; background: #FFFFFF; border: 1px solid #DADFDB; border-radius: 16px"></div>
</div>
</div>

<div style="position: absolute; inset: 0; background: rgba(27, 31, 30, 0.55); display: flex; align-items: flex-start; justify-content: center; padding: 96px 24px; box-sizing: border-box">
<section role="dialog" aria-labelledby="titulo-nuevo" style="width: 100%; max-width: 560px; background: #FFFFFF; border-radius: 20px; padding: 32px; box-sizing: border-box; display: flex; flex-direction: column; gap: 20px; box-shadow: 0 20px 60px rgba(0, 0, 0, 0.25)">
<div style="display: flex; justify-content: space-between; align-items: flex-start; gap: 16px">
<div>
<h1 id="titulo-nuevo" style="margin: 0; font-size: 26px">Nuevo recordatorio</h1>
<p style="margin: 6px 0 0; font-size: 16px; color: #4A524F">El asistente lo dirá en voz alta a la hora que elija.</p>
</div>
<a href="EscRecordatorios.dc.html" aria-label="Cerrar" style="width: 44px; height: 44px; border-radius: 12px; display: flex; align-items: center; justify-content: center; color: #1B1F1E; flex: none"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" style="stroke-width: 2; stroke-linecap: round; stroke-linejoin: round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></a>
</div>

<div style="display: flex; flex-direction: column; gap: 8px">
<label for="texto" style="font-size: 17px; font-weight: 700">¿Qué debe decir el asistente?</label>
<textarea id="texto" rows="2" style="font-family: inherit; font-size: 18px; padding: 12px 14px; border-radius: 12px; border: 2px solid #0E5E5A; resize: vertical">Tomar el medicamento de la noche</textarea>
<span style="font-size: 15px; color: #4A524F">Lo dirá así: «Le recuerdo: tomar el medicamento de la noche».</span>
</div>

<div style="display: flex; flex-direction: column; gap: 8px">
<label for="hora" style="font-size: 17px; font-weight: 700">Hora</label>
<input id="hora" type="time" value="20:00" style="font-family: inherit; font-size: 20px; padding: 10px 14px; min-height: 52px; box-sizing: border-box; border-radius: 12px; border: 1px solid #B9C1BC; width: 180px">
</div>

<fieldset style="border: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px">
<legend style="font-size: 17px; font-weight: 700; padding: 0; margin-bottom: 10px">¿Cuándo?</legend>
<label style="display: flex; align-items: center; gap: 12px; min-height: 48px; padding: 0 14px; border-radius: 12px; border: 1px solid #DADFDB; font-size: 17px"><input type="radio" name="cuando" style="width: 22px; height: 22px">Una vez</label>
<label style="display: flex; align-items: center; gap: 12px; min-height: 48px; padding: 0 14px; border-radius: 12px; border: 2px solid #0E5E5A; background: #E3F0EE; font-size: 17px; font-weight: 700"><input type="radio" name="cuando" checked style="width: 22px; height: 22px">Todos los días</label>
<label style="display: flex; align-items: center; gap: 12px; min-height: 48px; padding: 0 14px; border-radius: 12px; border: 1px solid #DADFDB; font-size: 17px"><input type="radio" name="cuando" style="width: 22px; height: 22px">Algunos días de la semana</label>
</fieldset>

<div style="display: flex; justify-content: flex-end; gap: 12px; padding-top: 4px">
<a href="EscRecordatorios.dc.html" style="min-height: 52px; padding: 0 22px; border-radius: 12px; border: 2px solid #DADFDB; color: #1B1F1E; text-decoration: none; display: inline-flex; align-items: center; font-size: 17px; font-weight: 700; box-sizing: border-box">Cancelar</a>
<a href="EscRecordatorios.dc.html" style="min-height: 52px; padding: 0 22px; border-radius: 12px; background: #0E5E5A; color: #FFFFFF; text-decoration: none; display: inline-flex; align-items: center; font-size: 17px; font-weight: 700; box-sizing: border-box">Guardar recordatorio</a>
</div>
</section>
</div>

</div>
</x-dc>

return {};
}
}
</script>
</body>
</html>

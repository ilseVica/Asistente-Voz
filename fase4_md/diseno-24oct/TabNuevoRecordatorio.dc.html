<div>
<h1 id="titulo-nuevo-t" style="margin: 0; font-size: 26px">Nuevo recordatorio</h1>
<p style="margin: 6px 0 0; font-size: 16px; color: #4A524F">El asistente lo dirá en voz alta a la hora que elija.</p>

<div style="display: flex; flex-direction: column; gap: 8px">
<label for="hora-t" style="font-size: 17px; font-weight: 700">Hora</label>
<input id="hora-t" type="time" value="10:30" style="font-family: inherit; font-size: 20px; padding: 10px 14px; min-height: 52px; box-sizing: border-box; border-radius: 12px; border: 1px solid #B9C1BC">
</div>
<div style="display: flex; flex-direction: column; gap: 8px">
<label for="fecha-t" style="font-size: 17px; font-weight: 700">Fecha</label>
<input id="fecha-t" type="date" value="2026-10-25" style="font-family: inherit; font-size: 18px; padding: 10px 14px; min-height: 52px; box-sizing: border-box; border-radius: 12px; border: 1px solid #B9C1BC">
</div>
</div>

<fieldset style="border: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px">

<label style="display: flex; align-items: center; gap: 12px; min-height: 48px; padding: 0 14px; border-radius: 12px; border: 1px solid #DADFDB; font-size: 17px"><input type="radio" name="cuando-t" style="width: 22px; height: 22px">Todos los días</label>
<label style="display: flex; align-items: center; gap: 12px; min-height: 48px; padding: 0 14px; border-radius: 12px; border: 1px solid #DADFDB; font-size: 17px"><input type="radio" name="cuando-t" style="width: 22px; height: 22px">Algunos días de la semana</label>
</fieldset>

<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; padding-top: 4px">
<a href="TabRecordatorios.dc.html" style="min-height: 52px; border-radius: 12px; border: 2px solid #DADFDB; color: #1B1F1E; text-decoration: none; display: flex; align-items: center; justify-content: center; font-size: 17px; font-weight: 700; box-sizing: border-box">Cancelar</a>

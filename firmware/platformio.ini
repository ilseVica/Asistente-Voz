; PlatformIO usa src/ y ya anade include/ al camino de busqueda de cabeceras,
; asi que config.h y secrets.h se incluyen sin ruta.
[env]
platform = espressif32@6.12.0
board = nodemcu-32s
framework = arduino
monitor_speed = 115200
monitor_filters = time, colorize
upload_speed = 460800

; Las versiones exactas que se verificaron leyendo el codigo de cada libreria. No se
; suben de forma flotante: cambiar cualquiera obliga a releer la libreria y repetir
; la verificacion del plan.
;
; AsyncTCP NO va aqui a proposito: fauxmoESP lo pide por su library.json y el core
; 2.0.17 ya trae la suya. Anadir esphome/AsyncTCP-esphome@2.1.4 hace que se enlacen
; las dos y el enlazador falla con "multiple definition" en todos los metodos de
; AsyncClient. Se documenta aqui porque la propuesta lo menciona y ahora se sabe que
; la linea sobraba.
lib_deps =
    cyijun/ESP32MQTTClient@1.1.5
    vintlabs/FauxmoESP@3.4.1
    bblanchon/ArduinoJson@7.4.3
    adafruit/DHT sensor library@1.4.7
    adafruit/Adafruit Unified Sensor@1.1.15

build_flags =
    -I include
    -D NDEBUG
    -D CORE_DEBUG_LEVEL=1
    -D CONFIG_ARDUINO_ESP32_TIME_SYSCALL_USE_RTC_VSYNC

; Entorno normal. El firmware que va a la instalacion.
[env:nodemcu-32s]
build_flags =
    ${env.build_flags}
    -D PRUEBAS=0

; Entorno de pruebas. Es el unico que trae los comandos de prueba por monitor
; serie y el unico que se suscribe a casa/sala/nodo/prueba_gas.
; Ver 6.10 del plan de riesgos: nunca cargar este build en la instalacion.
[env:nodemcu-32s-test]
build_flags =
    ${env.build_flags}
    -D PRUEBAS=1


; Entorno de depuracion: el mismo firmware de pruebas con el log al maximo. Se deja
; declarado aqui para no tener que editar build_flags a mano cada vez que hace falta
; ver una linea por lectura.
[env:depurar]
extends = env:nodemcu-32s-test
build_flags = ${env:nodemcu-32s-test.build_flags} -DNIVEL_LOG=3

# Broker MQTT de la laptop (red del hotspot del iPhone).
# Generado por laptop/instalar.sh; no contiene secretos.

allow_anonymous false
password_file /etc/mosquitto/passwd
acl_file /etc/mosquitto/acl

persistence true
persistence_location /var/lib/mosquitto/
autosave_interval 60

include_dir /etc/mosquitto/conf.d

# Loopback: pruebas locales. Se usa bind_interface lo porque mezclar un
# listener por IP (127.0.0.1) con otro por bind_interface en el mismo puerto
# hace fallar el bind.
listener 1883
bind_interface lo
socket_domain ipv4

# Interfaz Wi-Fi del hotspot (la detecta laptop/instalar.sh).
listener 1883
bind_interface __WIFI_IFACE__
socket_domain ipv4

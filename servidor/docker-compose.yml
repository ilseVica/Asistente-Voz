name: asistente

# Broker MQTT del servidor de la casa.
# Paso 0b de la Fase 4. Este archivo implementa la propuesta v2.
#
# Decisiones ya aplicadas:
#   - network_mode: host. Sin red propia de Compose, porque hay que escuchar en
#     127.0.0.1, en tailscale0 y en ens18 a la vez, y porque el puente se
#     conecta por IP de Tailscale y por MagicDNS.
#   - user "1883:1883": el proceso arranca YA como mosquitto, sin root. Es
#     necesario para que el grupo 1000 de group_add sobreviva: si el proceso
#     arranca como root, Mosquitto llama a initgroups("mosquitto", 1883) al
#     bajar privilegios, y eso BORRA los grupos suplementarios que puso Docker.
#     Verificado: con root + group_add, el broker igual dice
#     "Unable to open pwfile".
#     Sin root no corre el chown -R del entrypoint, pero no hace falta: al
#     crearse el volumen, Docker copia el contenido y la propiedad de
#     /mosquitto/data de la imagen, que ya es 1883:1883. Verificado.
#   - group_add 1000: el passwd es 640 ilse:ilse y el broker no es el dueno,
#     asi que lo lee por el grupo (gid 1000).
#   - tmpfs en /mosquitto/log: la imagen declara VOLUME ahi y, sin montaje,
#     Docker crearia un volumen anonimo en cada "up".
#   - log_dest stdout: los registros salen por "docker compose logs".
#     "log_privacy" NO existe en Mosquitto; una opcion desconocida aborta el
#     arranque.

services:
  mosquitto:
    image: eclipse-mosquitto:2.0.22
    container_name: asistente-mosquitto

    restart: unless-stopped
    network_mode: host
    stop_grace_period: 20s

    user: "1883:1883"
    group_add:
      - "1000"

    environment:
      # Solo para el healthcheck. El usuario "salud" existe unicamente para eso.
      MOSQUITTO_SALUD_PASSWORD: ${MQTT_SALUD_PASSWORD:?falta MQTT_SALUD_PASSWORD en servidor/.env}

    volumes:
      # Configuracion en solo lectura: el broker nunca la modifica.
      - ./mosquitto/config/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./mosquitto/config/acl.conf:/mosquitto/config/acl.conf:ro
      # Secretos, fuera del repositorio: aqui queda passwd (640, ilse:ilse).
      - ${MOSQUITTO_SECRETS_DIR}:/mosquitto/secrets:ro
      # Persistencia: sesiones y mensajes retenidos entre reinicios.
      - mosquitto_data:/mosquitto/data

    tmpfs:
      - /mosquitto/log
      - /tmp

    read_only: true
    security_opt:
      - no-new-privileges:true

    mem_limit: 256m
    cpus: 0.50
    pids_limit: 100

    # Driver "local": el json-file con rotación (max-size/max-file) dejó de
    # mostrarse completo en `docker logs` (se truncaba en el archivo rotado más
    # antiguo) y parecía que el broker no registraba, aunque sí escribía. El
    # driver local no tiene esa concatenación rota entre rotados. Se aplicará al
    # recrear este contenedor (requiere reiniciar el broker).
    logging:
      driver: local
      options:
        max-size: "5m"
        max-file: "3"

    healthcheck:
      # Un $SYS retenido llega al suscribirse, sin esperar los 10 s de
      # sys_interval. Por eso -W 5 basta.
      test:
        - CMD
        - mosquitto_sub
        - -h
        - 127.0.0.1
        - -p
        - "1883"
        - -u
        - salud
        - -P
        - ${MQTT_SALUD_PASSWORD:?falta MQTT_SALUD_PASSWORD en servidor/.env}
        - -t
        # $$ escapa el $ para Compose: sin esto, Compose leeria $SYS como una
        # variable y el topic quedaria /broker/version.
        - $$SYS/broker/version
        - -C
        - "1"
        - -W
        - "5"
        - -v
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # Orquestador. Recibe las alertas de gas y de ayuda, las guarda en SQLite y
  # avisa a la familia por Telegram.
  #
  # Decisiones ya aplicadas:
  #   - Tambien con network_mode: host. No es por capricho ni por descuido: es la
  #     misma razon que el broker. El orquestador tiene que alcanzar al broker en
  #     127.0.0.1, y con una red propia de Compose, "localhost" dentro del
  #     contenedor seria el propio contenedor. Se podria usar el nombre del
  #     servicio, pero entonces el MQTT_HOST del .env tendria que cambiar segun
  #     donde corra, y la conexion de Telegram es saliente y da igual.
  #   - restart: unless-stopped. Si el proceso muere, vuelve solo. Una alerta de
  #     gas que se pierde porque el proceso se cayera y nadie lo notara es
  #     exactamente el fallo que este servicio existe para evitar.
  #   - Volumen en /datos. SIN este volumen, cada "up" que recree el contenedor
  #     perderia los ids ya procesados, y con ellos la deduplicacion: se volveria
  #     a avisar a la familia de alertas que ya se habian mandado.
  #   - El usuario "orquestador" del MQTT lo lee del .env, y es OBLIGATORIO. Sin
  #     password el proceso muere al arrancar. Es a proposito: mejor que arranque
  #     y no pueda conectarse.
  #   - El token de Telegram NO es obligatorio. Sin token el servicio arranca,
  #     recibe alertas y las guarda; en cuanto se anada y se reinicie el
  #     servicio, salen todas.
  #   - Sin depends_on con condition: service_healthy. El orquestador arranca
  #     aunque el broker todavia este levantandose: paho reconecta solo con su
  #     propio mecanismo, y esperar aqui solo retrasaria el arranque.

  orquestador:
    build:
      context: ./orquestador
      dockerfile: Dockerfile
    image: asistente-orquestador:1.0

    container_name: asistente-orquestador

    restart: unless-stopped
    network_mode: host
    stop_grace_period: 20s

    environment:
      MQTT_HOST: 127.0.0.1
      MQTT_PUERTO: "1883"
      MQTT_USUARIO: orquestador
      MQTT_ORQUESTADOR_PASSWORD: ${MQTT_ORQUESTADOR_PASSWORD:?falta MQTT_ORQUESTADOR_PASSWORD en servidor/.env}
      MQTT_CLIENT_ID: orquestador
      MQTT_SESION_LIMPIA: "false"
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_ACTIVAR_BOT: ${TELEGRAM_ACTIVAR_BOT:-0}
      PANEL_URL: ${PANEL_URL:-}
      # Lugar del sensor de gas para el aviso de Telegram («El sensor de la
      # cocina...»). Formato en orquestador/config.py. Sin valor, «cocina».
      UBICACION_GAS: ${UBICACION_GAS:-cocina}
      ORQUESTADOR_DB: /datos/orquestador.sqlite3
      # La zona de la casa. El contenedor va en UTC por defecto; con esta variable
      # `time.localtime()` y `datetime.now()` pasan a hora de Mazatlan. Los
      # recordatorios la usan para saber cuando toca, y de paso los textos de
      # Telegram que mostraban la hora (atendida, /alertas) dejan de salir en UTC.
      TZ: America/Mazatlan
      NIVEL_LOG: ${NIVEL_LOG:-INFO}

    volumes:
      # La base de datos y el registro de la familia. Ver la nota de arriba.
      - orquestador_datos:/datos

    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true

    mem_limit: 256m
    cpus: 0.50
    pids_limit: 100

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Servicio de voz. Escucha por WebSocket, reconoce con Vosk y publica el texto en
  # `casa/sala/voz/texto`. No decide nada: las intenciones son del orquestador.
  #
  # Decisiones ya aplicadas:
  #   - network_mode: host, como los demas: el broker esta en 127.0.0.1 y el
  #     satelite se conecta por Tailscale. Un WebSocket de la libreria escucha en
  #     UNA direccion, asi que `servidor_voz.py` abre un socket por cada una de
  #     VOZ_DIRECCIONES. Por eso nunca se pone 0.0.0.0: con el, cualquier interfaz
  #     nueva de la VM quedaria escuchando sin que nadie lo decidiera.
  #   - El modelo va montado en solo lectura en /modelo, y NO dentro de la imagen:
  #     son decenas de MB que cambian de version de vez en cuando, y meterlos en una
  #     capa de Docker haria que cada actualizacion del modelo reconstruyera la
  #     imagen. `servidor/voz/modelos/` esta en .gitignore.
  #   - mem_limit 512m y cpus 1.0: es el servicio que mas RAM usa (el modelo small
  #     ocupa unos 300 MB), medido en la VM. El orquestador y el broker se quedan en
  #     256m porque no cargan ningun modelo.
  #   - `read_only: true` con tmpfs en /tmp: no escribe nada en su sistema de
  #     archivos. El audio no toca disco en ningun momento.
  #   - Sin depends_on con condition: service_healthy. Igual que los demas: paho
  #     reconecta solo. Como el orquestador, el servicio arranca aunque el broker
  #     este levantandose.
  #
  # OJO: `VOZ_TOKEN_SHA256` y `MQTT_VOZ_PASSWORD` son OBLIGATORIAS y sin valor por
  # defecto. Sin la primera el servicio no puede autenticar al satelite; sin la
  # segunda no puede publicar. En los dos casos muere al arrancar, que es lo que se
  # quiere: un servicio de voz que arranca y no reconoce nada parece sano.

  voz:
    build:
      context: ./voz
      dockerfile: Dockerfile
    image: asistente-voz:1.0

    container_name: asistente-voz

    restart: unless-stopped
    network_mode: host
    stop_grace_period: 20s

    environment:
      VOZ_PUERTO: "2700"
      # Las tres direcciones del sistema por defecto. Ver la nota de arriba.
      VOZ_DIRECCIONES: ${VOZ_DIRECCIONES:-127.0.0.1 192.168.1.169 100.116.194.116}
      VOZ_MODELO: /modelo/vosk-model-small-es-0.42
      VOZ_GRAMATICA: /app/gramatica.json
      VOZ_TOKEN_SHA256: ${VOZ_TOKEN_SHA256:?falta VOZ_TOKEN_SHA256 en servidor/.env}
      MQTT_HOST: 127.0.0.1
      MQTT_PUERTO: "1883"
      MQTT_USUARIO: voz
      MQTT_VOZ_PASSWORD: ${MQTT_VOZ_PASSWORD:?falta MQTT_VOZ_PASSWORD en servidor/.env}
      MQTT_CLIENT_ID: voz
      NIVEL_LOG: ${NIVEL_LOG:-INFO}

    volumes:
      # El modelo, en solo lectura. Ver descargar-modelo.sh.
      - ./voz/modelos:/modelo:ro

    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true

    mem_limit: 512m
    cpus: 1.0
    pids_limit: 100

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    healthcheck:
      # Un connect a 127.0.0.1. `servidor_voz.py` abre SIEMPRE el socket de
      # loopback ademas de los de VOZ_DIRECCIONES, asi que este healthcheck no
      # depende de que Tailscale o la LAN esten levantados. Si un socket de red
      # falla, el servicio avisa por el log y sigue con el que si pudo abrir.
      test:
        - CMD
        - python
        - -c
        - "import socket; s=socket.create_connection(('127.0.0.1',2700),3); s.close()"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # Panel web de los familiares. Es la cuarta pieza del sistema: el mismo estado que
  # el bot cuenta por Telegram, pero en una pagina web que se abre desde un movil y no
  # necesita instalar nada.
  #
  # Decisiones ya aplicadas:
  #   - build con context: . (la raiz de servidor/) y no panel/. El panel importa
  #     config, db, alertas, panel_acceso y sanear del orquestador, y eso solo se
  #     puede con el contexto en la raiz. Los ficheros de panel/ entran por su
  #     Dockerfile, que los copia a mano.
  #   - El web_build va montado en solo lectura y NO al repositorio: son unos
  #     cuantos MB de JavaScript que se regeneran con `flutter build web`, y el
  #     cambio de version del frontend es "recompilar y reiniciar", no un commit de
  #     binarios. El orden es compilar ANTES de `docker compose build panel`, y
  #     esta escrito en panel/README.md.
  #   - network_mode: host, por la misma razon que los otros dos: el broker esta en
  #     127.0.0.1 y con red propia "localhost" seria el propio contenedor. Y como
  #     `host` no admite varios `--host`, el proceso abre un socket por direccion de
  #     PANEL_DIRECCIONES y se los pasa a uvicorn.
  #   - El healthcheck va contra 127.0.0.1 y NO contra las direcciones configuradas.
  #     Si Tailscale esta caido, la direccion del panel no resuelve y el contenedor
  #     quedaria "unhealthy" sin motivo; por eso `panel/api.py` abre SIEMPRE un
  #     socket en 127.0.0.1 ademas de los de PANEL_DIRECCIONES.
  #   - Sin depends_on con condition: service_healthy. Igual que el orquestador:
  #     paho reconecta solo, y esperar solo retrasaria el arranque.
  #   - `read_only: true` con tmpfs en /tmp: el panel no escribe nada en su sistema de
  #     ficheros. Lo unico que escribe es en /datos, que es el volumen.
  #   - El volumen de /datos va en lectura Y escritura: el panel lee las alertas y
  #     los familiares, y escribe en panel_enlaces y panel_tokens. Con el mismo uid
  #     que el orquestador (1000) para que los dos puedan escribir en el mismo
  #     fichero SQLite.

  panel:
    build:
      context: .
      dockerfile: panel/Dockerfile
    image: asistente-panel:1.0

    container_name: asistente-panel

    restart: unless-stopped
    network_mode: host
    stop_grace_period: 20s

    environment:
      MQTT_HOST: 127.0.0.1
      MQTT_PUERTO: "1883"
      MQTT_USUARIO: panel
      # OBLIGATORIA. Sin ella el proceso muere al arrancar, y a proposito: un panel
      # sin conexion al broker parece sano (la web carga, el healthcheck pasa) pero
      # no muestra ni un dato. Que se note en el primer `docker logs` es mejor.
      MQTT_PANEL_PASSWORD: ${MQTT_PANEL_PASSWORD:?falta MQTT_PANEL_PASSWORD en servidor/.env}
      MQTT_CLIENT_ID: panel-api
      MQTT_SESION_LIMPIA: "true"
      ORQUESTADOR_DB: /datos/orquestador.sqlite3
      PANEL_URL: ${PANEL_URL:-}
      # Tailscale y, si hace falta en modo instalacion, la IP de casa. Nunca
      # 0.0.0.0: esa no la escribe nadie, y con ella el panel de la familia se
      # abriria a cualquiera que llegara al puerto.
      PANEL_DIRECCIONES: ${PANEL_DIRECCIONES:-100.116.194.116}
      # Con `${PANEL_PUERTO:-8080}` y no con "8080" a pelo, para que cambiarlo en .env
      # cambie de verdad el puerto donde escucha. Con el valor fijo, poner otra cosa en
      # .env no daria error: el panel seguiria en el 8080 y el healthcheck, que si lee
      # PANEL_PUERTO del entorno, sepondria a mirar un puerto donde no hay nada. Un
      # ajuste que no hace nada es peor que uno que no existe.
      PANEL_PUERTO: ${PANEL_PUERTO:-8080}
      MODO_SITIO: ${MODO_SITIO:-instalacion}
      # La misma zona que el orquestador, por coherencia: las horas que se
      # muestran o se calculan (la proxima vez de un recordatorio) son de Mazatlan.
      TZ: America/Mazatlan
      NIVEL_LOG: ${NIVEL_LOG:-INFO}

    volumes:
      # La MISMA base que el orquestador, y el mismo volumen.
      - orquestador_datos:/datos
      # El build de Flutter, en solo lectura: el panel sirve ficheros estaticos y no
      # tiene por que escribir en ellos.
      - ./panel/web_build:/srv/web:ro

    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true

    mem_limit: 256m
    cpus: 0.50
    pids_limit: 100

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    healthcheck:
      # /api/salud va SIN autenticacion a proposito: el healthcheck no tiene token, y
      # ponerlo como variable de entorno seria dejar una credencial en el `docker
      # inspect`. Y no devuelve nada de la casa: ni alertas, ni chat_id, ni el estado
      # de los dispositivos.
      # CMD-SHELL y no CMD para poder leer $PANEL_PUERTO del entorno del contenedor: con
      # CMD el 8080 quedaria escrito aqui y cambiar PANEL_PUERTO en .env dejaria el
      # healthcheck apuntando a un puerto cerrado, con el contenedor "unhealthy" y
      # ninguna razon.
      test:
        - CMD-SHELL
        - "python -c \"import os,sys,urllib.request; p=os.environ.get('PANEL_PUERTO','8080'); sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:'+p+'/api/salud', timeout=3).status==200 else 1)\""
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

# Nodo de Tailscale SOLO para Funnel: publica el panel web por Internet para
  # quien no tiene Tailscale. Etapa 2 del panel.
  #
  # Decisiones ya aplicadas:
  #   - network_mode: host + TS_USERSPACE=true. La misma red que los otros tres
  #     servicios. En userspace tailscaled no crea una interfaz tailscale0, asi
  #     que no choca con la del host (nodo "villaca"), y el backend del Funnel
  #     apunta a 127.0.0.1:8080, el socket que el panel abre siempre.
  #   - --port=41642: la VM ya tiene su propio tailscaled escuchando en UDP 41641
  #     (el de "villaca"); compartiendo la red del host, sin este puerto distinto
  #     el del contenedor no podria abrir el suyo. Documentado: `--port=N` en el
  #     manual de tailscaled, pasado aqui por TS_TAILSCALED_EXTRA_ARGS.
  #   - TAILSCALE_AUTHKEY SIN ":?". La clave es de UN SOLO USO y caduca en 1 dia,
  #     y solo hace falta en el primer arranque, cuando no hay estado en el
  #     volumen. Con estado y TS_AUTH_ONCE=true el contenedor arranca aunque la
  #     clave haya caducado o la variable este vacia. Como generar una clave
  #     nueva si se pierde el volumen, en panel/README.md.
  #   - El estado (y con el la identidad del nodo) va en tailscale_datos. Sin
  #     volumen, cada reinicio registraría un nodo nuevo: cambiarian el nombre en
  #     el DNS de Funnel y el certificado.
  #   - serve.json montado en solo lectura: ahi estan la Web del Funnel y el
  #     AllowFunnel. Cambios en el archivo -> recrear el contenedor.
  #   - read_only con tmpfs en /tmp y /var/run (ahi vive el socket de
  #     tailscaled). Si containerboot no levantara por esto, se retira el
  #     read_only y se deja anotado.
  #   - El healthcheck usa `tailscale status` (el CLI habla con el socket local):
  #     exit 0 solo si el nodo esta logueado y en el tailnet.
  tailscale:
    image: tailscale/tailscale:v1.102.5
    container_name: asistente-tailscale

    hostname: asistente

    restart: unless-stopped
    network_mode: host
    stop_grace_period: 20s

    environment:
      TS_HOSTNAME: asistente
      TS_AUTHKEY: ${TAILSCALE_AUTHKEY:-}
      TS_STATE_DIR: /var/lib/tailscale
      # Solo se autentica si NO hay estado guardado. Con estado, un `up` con la
      # clave caducada o vacia no toca nada.
      TS_AUTH_ONCE: "true"
      TS_USERSPACE: "true"
      TS_TAILSCALED_EXTRA_ARGS: --port=41642
      TS_SERVE_CONFIG: /etc/tailscale/serve.json

    volumes:
      # La identidad del nodo. Sin este volumen, cada recreacion registra un nodo
      # nuevo (nuevo nombre, nuevo certificado de Funnel).
      - tailscale_datos:/var/lib/tailscale
      - ./tailscale/serve.json:/etc/tailscale/serve.json:ro

    read_only: true
    tmpfs:
      - /tmp
      - /var/run
    security_opt:
      - no-new-privileges:true

    mem_limit: 64m
    cpus: 0.25
    pids_limit: 100

    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"

    healthcheck:
      test: ["CMD", "tailscale", "status"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  # El proyecto se llama "asistente" (name: arriba), asi que el volumen real se
  # llama asistente_mosquitto_data. La clave va sin el prefijo para que el
  # nombre final no quede "asistente_asistente_...".
  mosquitto_data:

  # La base del orquestador. Sin este volumen, reiniciar el servicio borra los ids
  # procesados y se vuelven a mandar alertas ya avisadas.
  orquestador_datos:

  # La identidad del nodo de Funnel. Ver el comentario del servicio de arriba.
  tailscale_datos:

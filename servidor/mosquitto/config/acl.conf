# ============================================================================
# Permisos por topico - Mosquitto 2.0.22
#
# Fuente de verdad: seccion "Contrato de comunicacion MQTT" del plan de la Fase 4
# (fase4_md/Fase_4_Desarrollo_e_Integracion.md, lineas 138 a 151). Los topicos
# de este archivo son los de esa tabla, sin abreviar ni renombrar. El prefijo es
# casa/<lugar>/<elemento>/<accion> y el lugar es "sala".
#
# Formato de cada linea:
#   topic [read|write|readwrite|deny] <topico>
#
# Wildcards: + un nivel, # varios niveles.
#
# Reparto de la tabla del contrato:
#
#   casa/sala/luz/set                 publica Servidor      escucha ESP32
#   casa/sala/luz/estado              publica ESP32         escucha Servidor
#   casa/sala/sensores                publica ESP32         escucha Servidor
#   casa/sala/alerta/gas              publica ESP32         escucha Servidor
#   casa/sala/alerta/ayuda            publica ESP32 o Serv. escucha Servidor
#   casa/sala/alerta/inactividad      publica Servidor      escucha Servidor (bot y panel)
#   casa/sala/satelite/decir          publica Servidor      escucha Satelite
#   casa/sala/satelite/estado         publica Satelite      escucha Servidor (LWT, retain)
#   casa/sala/nodo/estado             publica ESP32         escucha Servidor (LWT, retain)
#   casa/sala/nodo/config             publica Servidor      escucha ESP32 (retain)
#   casa/sala/nodo/prueba_gas         publica Laptop        escucha ESP32 (PRUEBAS=1)
#   $SYS/broker/connection/puente-sitio/state  publica el puente  escucha Servidor
#
# D1 RESUELTO (2026-10-03). El topico del estado del enlace es
# $SYS/broker/connection/puente-sitio/state, porque Mosquitto arma ese topico con
# el remote_clientid del puente, que es "puente-sitio". El plan se corrige para
# que diga lo mismo. Antes este archivo daba permiso en los dos caminos (.../sitio/state
# y .../puente-sitio/state) por si acaso; ya solo queda el que existe de verdad.
#
# OJO: cambiar este archivo exige reiniciar el contenedor. El broker lo lee una
# sola vez al arrancar.
# ============================================================================

# ----------------------------------------------------------------------------
# nodo: los ESP32 de la casa (electrico, gas).
# Publican estado de la luz, sensores y sus alertas, y el estado del nodo con su
# Last Will. Escuchan la orden de la luz y la configuracion de umbrales.
# No publican ordenes: la luz la manda el servidor.
# ----------------------------------------------------------------------------
user nodo
topic write casa/sala/luz/estado
topic write casa/sala/sensores
topic write casa/sala/alerta/gas
topic write casa/sala/alerta/ayuda
topic write casa/sala/nodo/estado
topic read casa/sala/luz/set
topic read casa/sala/nodo/config
topic read casa/sala/nodo/prueba_gas

# ----------------------------------------------------------------------------
# puente: el broker que corre en la laptop, cuando exista (hoy no: el broker
# unico es el de villaca).
#
# El puente reenvia en ambos sentidos con "topic casa/# both 1", asi que necesita
# lectura y escritura en todo casa/#. Consecuencia asumida por el propio plan:
# el broker de la laptop es de confianza y lo que se publica ahi llega a los
# ESP32. Lo que mantiene esto acotado es que el puente NO puede salir de casa/#.
#
# prueba_gas entra por aqui: en el contrato se publica desde la laptop con
# mosquitto_pub al broker local y el puente lo reenvia al servidor.
#
# El estado del enlace lo escribe Mosquitto solo al conectar el puente (1) y como
# Last Will al caerse (0), retenido. El topico sale del remote_clientid.
# ----------------------------------------------------------------------------
user puente
# Reenvia en ambos sentidos con "topic casa/# both 1". El plan lo dice tal cual:
# una ACL limita al usuario puente a los topicos casa/#.
topic readwrite casa/#
topic write $SYS/broker/connection/puente-sitio/state

# ----------------------------------------------------------------------------
# orquestador: el agente que corre en el servidor (unidades, reglas, bot, panel).
# Es el cerebro: escribe donde dice la tabla y escucha todo lo de la casa, mas el
# estado del enlace con el sitio, que es lo que permite al panel mostrar
# "sitio sin conexion" en menos de 90 segundos.
# ----------------------------------------------------------------------------
user orquestador
topic write casa/sala/luz/set
topic write casa/sala/alerta/inactividad
topic write casa/sala/satelite/decir
topic write casa/sala/nodo/config
# La tabla dice que alerta/ayuda la publica el ESP32 (via Alexa) O el servidor
# (via voz). Las dos ramas tienen que existir, o una alerta de voz nunca sale.
topic write casa/sala/alerta/ayuda
# Lectura topico por topico, sin "casa/sala/#": el servidor escucha todo lo que
# publica la casa, y no hace falta que pueda escuchar su propia voz.
topic read casa/sala/luz/estado
topic read casa/sala/sensores
topic read casa/sala/alerta/gas
topic read casa/sala/alerta/ayuda
topic read casa/sala/alerta/inactividad
topic read casa/sala/satelite/estado
topic read casa/sala/nodo/estado
# nodo/prueba_gas NO esta aqui a proposito: la tabla dice que lo escucha el ESP32
# compilado con PRUEBAS=1, no el servidor.
topic read $SYS/broker/connection/+/state

# ----------------------------------------------------------------------------
# satelite: el agente que corre en la laptop cuando se conecta al broker del
# servidor por Tailscale.
# Solo publica su propio estado (con Last Will y retain) y solo escucha lo que
# el servidor le dice que diga. NO publica en casa/sala/luz/set: esa orden la
# emite el servidor.
# ----------------------------------------------------------------------------
user satelite
topic write casa/sala/satelite/estado
topic read casa/sala/satelite/decir

# ----------------------------------------------------------------------------
# salud: solo el healthcheck del contenedor.
# No publica nada: ni luces, ni estados, ni satelite/decir, ni $SYS.
# ----------------------------------------------------------------------------
user salud
topic read $SYS/broker/version

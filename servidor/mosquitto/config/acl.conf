# ============================================================================
# Permisos por topico - Mosquitto 2.0.22
#
# Fuente de verdad: seccion "Contrato de comunicacion MQTT" del plan de la Fase 4
# (fase4_md/Fase_4_Desarrollo_e_Integracion.md, lineas 138 a 151). Los topicos
# de este archivo son los de esa tabla, sin abreviar ni renombrar. El prefijo es
# casa/<lugar>/<elemento>/<accion> y el lugar es "sala".
#
# Formato de cada linea:
#   topic [read|write|readwrite|deny] <topico>
#
# Wildcards: + un nivel, # varios niveles.
#
# Reparto de la tabla del contrato:
#
#   casa/sala/luz/set                 publica Servidor      escucha ESP32, Panel
#   casa/sala/luz/estado              publica ESP32         escucha Servidor, Panel
#   casa/sala/sensores                publica ESP32         escucha Servidor, Panel
#   casa/sala/alerta/gas              publica ESP32         escucha Servidor
#   casa/sala/alerta/ayuda            publica ESP32 o Serv. escucha Servidor
#   casa/sala/alerta/inactividad      publica Servidor      escucha Servidor (bot)
#   casa/sala/satelite/decir          publica Servidor      escucha Satelite, Panel
#   casa/sala/satelite/estado         publica Satelite      escucha Servidor, Panel (LWT, retain)
#   casa/sala/voz/texto               publica Servicio voz  escucha Servidor
#   casa/sala/nodo/estado             publica ESP32         escucha Servidor, Panel (LWT, retain)
#   casa/sala/nodo/config             publica Servidor      escucha ESP32 (retain)
#   casa/sala/nodo/prueba_gas         publica Laptop        escucha ESP32 (PRUEBAS=1)
#   $SYS/broker/connection/puente-sitio/state  publica el puente  escucha Servidor, Panel
#
# El "Panel" es el servicio web de los familiares (2026-10-05). Se anadio solo a las
# filas que puede leer de verdad y a las dos que puede escribir: `luz/set` y
# `satelite/decir`. Sus permisos estan al final del archivo, con el motivo de cada
# recorte.
#
# Y lo que NO esta, que es lo que se corrigio en la cabecera el 2026-10-05: el panel
# NO lee `casa/sala/alerta/inactividad`, ni `casa/sala/alerta/#` entero, ni
# `casa/sala/nodo/config`. La cabecera decia "escucha Servidor (bot y panel)" en la
# fila de inactividad y eso era falso: la ACL real nunca le dio ese permiso, asi que
# lo unico que estaba mal era el comentario. Un `acl.conf` que promete de mas es
# peor que uno que no promete: el que lo lee para Granted para publicar por MQTT lo
# que el bot recibe por polling, o para ajustar el tiempo de inactividad desde el
# panel, y esas dos cosas las hace el orquestador, no el panel.
#
# Las alertas del panel NO van por MQTT: salen de la misma SQLite que las del bot
# (`GET /api/alertas`). Por eso el panel no necesita ninguna de las tres filas de
# alerta. Ver el bloque `user panel` al final.
#
# D1 RESUELTO (2026-10-03). El topico del estado del enlace es
# $SYS/broker/connection/puente-sitio/state, porque Mosquitto arma ese topico con
# el remote_clientid del puente, que es "puente-sitio". El plan se corrige para
# que diga lo mismo. Antes este archivo daba permiso en los dos caminos (.../sitio/state
# y .../puente-sitio/state) por si acaso; ya solo queda el que existe de verdad.
#
# OJO: tras cambiar este archivo hay que RECARGAR el broker, no reiniciarlo. Con
# `docker kill -s HUP asistente-mosquitto` basta: mosquitto.conf(5) dice que
# `password_file` y `acl_file` se recargan con la senal de recarga, asi que un
# SIGHUP aplica los permisos nuevos sin cortar las conexiones. (Antes este
# comentario decia que hacia falta reiniciar; era falso y costaba un corte de
# servicio en cada cambio de ACL.)
# ============================================================================

# ----------------------------------------------------------------------------
# nodo: los ESP32 de la casa (electrico, gas).
# Publican estado de la luz, sensores y sus alertas, y el estado del nodo con su
# Last Will. Escuchan la orden de la luz y la configuracion de umbrales.
# No publican ordenes: la luz la manda el servidor.
# ----------------------------------------------------------------------------
user nodo
topic write casa/sala/luz/estado
topic write casa/sala/sensores
topic write casa/sala/alerta/gas
topic write casa/sala/alerta/ayuda
topic write casa/sala/nodo/estado
topic read casa/sala/luz/set
topic read casa/sala/nodo/config
topic read casa/sala/nodo/prueba_gas

# ----------------------------------------------------------------------------
# puente: el broker que corre en la laptop, cuando exista (hoy no: el broker
# unico es el de villaca).
#
# El puente reenvia en ambos sentidos con "topic casa/# both 1", asi que necesita
# lectura y escritura en todo casa/#. Consecuencia asumida por el propio plan:
# el broker de la laptop es de confianza y lo que se publica ahi llega a los
# ESP32. Lo que mantiene esto acotado es que el puente NO puede salir de casa/#.
#
# prueba_gas entra por aqui: en el contrato se publica desde la laptop con
# mosquitto_pub al broker local y el puente lo reenvia al servidor.
#
# El estado del enlace lo escribe Mosquitto solo al conectar el puente (1) y como
# Last Will al caerse (0), retenido. El topico sale del remote_clientid.
# ----------------------------------------------------------------------------
user puente
# Reenvia en ambos sentidos con "topic casa/# both 1". El plan lo dice tal cual:
# una ACL limita al usuario puente a los topicos casa/#.
topic readwrite casa/#
topic write $SYS/broker/connection/puente-sitio/state

# ----------------------------------------------------------------------------
# orquestador: el agente que corre en el servidor (unidades, reglas, bot, panel).
# Es el cerebro: escribe donde dice la tabla y escucha todo lo de la casa, mas el
# estado del enlace con el sitio, que es lo que permite al panel mostrar
# "sitio sin conexion" en menos de 90 segundos.
# ----------------------------------------------------------------------------
user orquestador
topic write casa/sala/luz/set
topic write casa/sala/alerta/inactividad
topic write casa/sala/satelite/decir
topic write casa/sala/nodo/config
# La tabla dice que alerta/ayuda la publica el ESP32 (via Alexa) O el servidor
# (via voz). Las dos ramas tienen que existir, o una alerta de voz nunca sale.
topic write casa/sala/alerta/ayuda
# Lectura topico por topico, sin "casa/sala/#": el servidor escucha todo lo que
# publica la casa, y no hace falta que pueda escuchar su propia voz.
topic read casa/sala/luz/estado
topic read casa/sala/sensores
topic read casa/sala/alerta/gas
topic read casa/sala/alerta/ayuda
topic read casa/sala/alerta/inactividad
topic read casa/sala/satelite/estado
topic read casa/sala/nodo/estado
# El texto que reconoce el servicio de voz. El orquestador lo lee para decidir la
# intencion (Paso 3) y, en esta etapa, para el eco de prueba.
topic read casa/sala/voz/texto
# nodo/prueba_gas NO esta aqui a proposito: la tabla dice que lo escucha el ESP32
# compilado con PRUEBAS=1, no el servidor.
topic read $SYS/broker/connection/+/state

# ----------------------------------------------------------------------------
# satelite: el agente que corre en la laptop cuando se conecta al broker del
# servidor por Tailscale.
# Solo publica su propio estado (con Last Will y retain) y solo escucha lo que
# el servidor le dice que diga. NO publica en casa/sala/luz/set: esa orden la
# emite el servidor.
# ----------------------------------------------------------------------------
user satelite
topic write casa/sala/satelite/estado
topic read casa/sala/satelite/decir

# ----------------------------------------------------------------------------
# voz: el servicio de reconocimiento (etapa A del Paso 2).
# Solo escribe el texto que reconocio, en un topico que no existia antes. No lee
# nada y no publica en ninguna parte mas: ni una alerta, ni la luz, ni lo que el
# satelite tiene que decir. El unico que puede encender la luz sigue siendo el
# orquestador.
# ----------------------------------------------------------------------------
user voz
topic write casa/sala/voz/texto

# ----------------------------------------------------------------------------
# salud: solo el healthcheck del contenedor.
# No publica nada: ni luces, ni estados, ni satelite/decir, ni $SYS.
# ----------------------------------------------------------------------------
user salud
topic read $SYS/broker/version

# ----------------------------------------------------------------------------
# panel: el servicio web que leen los familiares (2026-10-05, Etapa 1).
#
# Es el usuario mas recortado de todos, y el recorte es el punto: el panel es el
# unico que puede poner un movil cualquiera delante de la casa, y lo que puede
# hacer con esa sesion es lo que hay aqui, ni una linea mas.
#
# Lee el estado de la casa para dibujarlo, y publica en DOS topicos, que son
# las dos unicas acciones que un familiar puede provocar:
#
#   luz/set         apagar o encender la luz.
#   satelite/decir  decir que alguien ya esta atendiendo una alerta, para que el
#                   sitio deje de llamar. Lo usa la misma funcion que el bot
#                   (alertas.resolver), asi que el aviso sale solo la primera vez.
#
# Lo que NO puede hacer, y por que:
#
#   - No lee casa/sala/alerta/#. Las alertas no llegan por MQTT: el panel las lee
#     de SQLite, en la misma base de datos. Suscribirse aqui seria una segunda
#     via de entrada para lo mismo, y por la que un cliente podria ver alertas
#     aunque su token ya no valiera.
#   - No escribe alerta/inactividad ni ninguna otra alerta: el panel resuelve
#     alertas, no las crea. Crear una alerta desde un movil en la calle es una
#     forma de tener una alarma que uno mismo puede silenciar.
#   - No lee casa/sala/nodo/config: ahi estan los umbrales de gas de cada
#     habitación. No son un secreto, pero no son de quien tenga el panel abierto.
#   - No puede salir de casa/sala/#: no toca $SYS entero, solo el estado de
#     conexion, que es lo que necesita para saber si el sitio esta en linea.
#
# OJO: los retenidos (luz/estado, nodo/estado, satelite/estado) llegan al
# suscribirse y solo los entrega Mosquitto si el cliente que los publico SIGUE
# teniendo permiso de escritura en ese topico. Que `nodo` y `satelite` lo
# conserven es responsabilidad de sus propias lineas de arriba, no de estas.
# ----------------------------------------------------------------------------
user panel
topic read casa/sala/luz/estado
topic read casa/sala/sensores
topic read casa/sala/satelite/estado
topic read casa/sala/nodo/estado
topic write casa/sala/luz/set
topic write casa/sala/satelite/decir
topic read $SYS/broker/connection/+/state

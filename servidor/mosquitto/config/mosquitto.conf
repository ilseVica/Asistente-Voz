# ============================================================================
# Mosquitto 2.0.22 - broker MQTT del servidor de la casa
# Proyecto Asistente de Voz, Fase 4 Paso 0b
#
# Verificado contra el codigo y el man page de Mosquitto 2.0.22.
# Ojo: no existe la opcion "log_privacy". Mosquitto aborta con
# 'Error: Unknown configuration variable' si encuentra una opcion que no
# conoce, asi que aqui no hay ninguna inventada.
#
# ATENCION: password_file y acl_file se abren DESPUES de bajar privilegios.
# Mosquitto corre como root, lee la configuracion, cambia a uid/gid 1883
# (mosquitto) y solo entonces abre esos dos archivos. Por eso los dos van
# montados en solo lectura y group_add 1000 (gid de ilse) esta en el
# compose: permisos 640 propiedad ilse:ilse.
# ============================================================================

# ----------------------------------------------------------------------------
# Seguridad
# ----------------------------------------------------------------------------

# Sin lista de usuarios: todos los usuarios validos estan en passwd.
# Sin acceso para quien no este en passwd.
allow_anonymous false
password_file /mosquitto/secrets/passwd

# Permisos por topico. El usuario "salud" no tiene permisos de publicacion:
# solo se suscribe a $SYS/broker/version en el healthcheck.
acl_file /mosquitto/config/acl.conf

# ----------------------------------------------------------------------------
#Puertos
#
# Con network_mode: host no hay red propia de Compose. Se escuchan tres
# listeners en IPv4:
#   1. 127.0.0.1  -> solo el propio servidor. Lo usan el orquestador, el
#                     agente de la laptop por SSH y las pruebas.
#   2. tailscale0 -> 100.116.194.116. Lo usan la laptop y la VM dedicada
#                     cuando existan. Tailscale ya cifra el transito.
#   3. ens18      -> 192.168.1.169, la red de la casa. Lo usan los ESP32 por
#                     WiFi, que no son clientes de Tailscale.
# No hay listener en 0.0.0.0: si se agrega otra interfaz al servidor, no
# queda expuesta por accidente.
# ----------------------------------------------------------------------------

listener 1883 127.0.0.1
socket_domain ipv4

listener 1883
bind_interface tailscale0
socket_domain ipv4

listener 1883
bind_interface ens18
socket_domain ipv4

# ----------------------------------------------------------------------------
# Persistencia
#
# Un reinicio del contenedor no debe resetear los estados retenidos ni las
# sesiones. Sin esto, un corte de luz reinicia el "ultimo estado conocido"
# de cada dispositivo y las automatizaciones se disparan con informacion
# vieja.
# ----------------------------------------------------------------------------

persistence true
persistence_location /mosquitto/data/
persistence_file mosquitto.db

# Guardar en disco cada 60 s en vez de cada 300 s. Con cortes de luz en la
# casa, 300 s de datos retenidos perdidos producen estados falsos.
autosave_interval 60

# Las sesiones de clientes desconectados se olvidan a los 2 dias. Sin esto,
# las sesiones viejas se acumulan para siempre.
persistent_client_expiration 2d

# ----------------------------------------------------------------------------
# Limites
# ----------------------------------------------------------------------------

max_queued_messages 5000

# false = si la cola de un cliente desconectado se llena, sus mensajes QoS 0
# se descartan en vez de acumularse. Las lecturas de sensores llegan cada
# pocos segundos y no son retenidas: guardarlas solo llenaria el disco con
# datos viejos que ademas se perderian igual.
queue_qos0_messages false

max_inflight_messages 20

# Comprobar que quien publica un retenido tiene permiso de escritura sobre
# ese topico. Sin esto, el ACL solo se aplica al momento de publicar y un
# retenido ya guardado se seguiria entregando a quien no tenga permiso.
check_retain_source true

# ----------------------------------------------------------------------------
# Red
# ----------------------------------------------------------------------------

# Los mensajes son pequenos (sensores y actuadores). Sin Nagle se responde
# de inmediato, que es lo que quiere un boton de luz.
set_tcp_nodelay true

# ----------------------------------------------------------------------------
# $SYS y salud
# ----------------------------------------------------------------------------

# Tope de 20 clientes por listener. Un ESP32 trabado no puede agotar el broker.
max_connections 20

# Cada 10 s se publica el estado del broker en $SYS/broker/*. El healthcheck
# usa $SYS/broker/version, que ademas llega retenido al suscribirse.
sys_interval 10

# ----------------------------------------------------------------------------
# Registro
#
# Todo a stdout, que es donde lo lee "docker compose logs". Nunca se escriben
# contrasenas ni cargas utiles de los mensajes, asi que no hay nada que
# enmascarar.
# ----------------------------------------------------------------------------

log_dest stdout
log_timestamp true
connection_messages true

log_type error
log_type warning
log_type notice
log_type information

# Descomentar SOLO para depurar permisos:
# log_type debug
# Con log_type normal, un PUBLISH denegado NO deja ninguna linea. Si alguna
# vez hace falta verlo, hay que subir a debug (log_type all) y buscar
# 'Denied PUBLISH'.

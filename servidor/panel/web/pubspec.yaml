name: asistente_panel
description: "Panel web de la familia: estado de la casa, luz y alertas."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  http: 1.6.0
  shared_preferences: 2.5.5
  web_socket_channel: 3.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/fuentes/

  fonts:
    - family: AtkinsonHyperlegible
      fonts:
        - asset: assets/fuentes/AtkinsonHyperlegible-Regular.ttf
        - asset: assets/fuentes/AtkinsonHyperlegible-Bold.ttf
          weight: 700
